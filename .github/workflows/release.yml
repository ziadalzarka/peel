name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      TAP: ziadalzarka/homebrew-tap
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: build archives
        run: make dist VERSION="$VERSION"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt

      - name: update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so $TAP was not updated." >&2
            echo "Create a fine-grained PAT with Contents: read and write on $TAP," >&2
            echo "then: gh secret set HOMEBREW_TAP_TOKEN --repo ziadalzarka/peel" >&2
            exit 1
          fi

          .github/scripts/formula.sh "$VERSION" dist > peel.rb

          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          mv peel.rb tap/Formula/peel.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/peel.rb
          if git diff --quiet --cached; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "peel $VERSION"
          git push
